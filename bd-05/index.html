<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GameEngine ES5 — Sweetie-16 Procedural 2D Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #1a1c2c;
      color: #f4f4f4;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #viewport-shell {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    canvas#engine-canvas {
      display: block;
      background-color: #1a1c2c;
      border: 3px solid #333c57;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px #566c86;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="viewport-shell">
    <canvas id="engine-canvas" width="640" height="360"></canvas>
  </div>

  <script src="GameEngine.js"></script>
  <script src="game.js"></script>
</body>
</html>
